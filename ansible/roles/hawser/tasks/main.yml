---
# Agente Hawser per Dockhand, installato di default su ogni nodo che riceve Docker
# (girato subito dopo il ruolo common nella stessa play, vedi site.yml Fase 1).
#
# Modalità Standard (locale), non Edge: in Edge tutti gli agent avrebbero condiviso
# lo stesso token emesso da Dockhand per "l'ambiente", ma Dockhand tratta un
# token/ambiente come UNO slot — verificato dal vivo con due host reali: ogni
# nuova connessione veniva trattata come sostituzione della precedente
# ("websocket close: Replaced"), i due agent si scalzavano a vicenda in loop
# permanente. In Standard è l'agent ad ascoltare ed è Dockhand a connettersi in
# uscita verso ciascun host con il SUO token (generato via openssl, un token per
# host, salvato nella sua cartella dedicata in Infisical) — nessuno slot condiviso.
#
# Riferimento ufficiale verificato dal README del progetto (Finsys/hawser), non
# dal primo risultato di ricerca trovato — quello dava nome immagine e variabili
# d'ambiente sbagliati (fnsys/hawser invece di ghcr.io/finsys/hawser).

- name: Assicura che la directory /opt/hawser esista sulla target
  ansible.builtin.file:
    path: /opt/hawser
    state: directory
    mode: '0755'

- name: Copia il docker-compose.yml di Hawser dalla fonte di verità tracciata
  # docker-compose/hawser/ nel repo (stesso path/nome di /opt/docker-compose su
  # pve-management, tracciato direttamente — vedi commit di ristrutturazione
  # docker/ -> docker-compose/) è un container come tutti gli altri, non un
  # template generato al volo da questo ruolo: prima veniva scritto qui sotto
  # come contenuto letterale (ansible.builtin.copy: content:), invisibile a chi
  # legge il repo e diverso, in linea di principio, da quello che gira davvero.
  # A differenza del ruolo docker_service (che copia solo per i servizi elencati
  # in variables.tf), questo task gira SEMPRE, su ogni host di questa play
  # (hosts: all in Fase 1): Hawser va installato di default ovunque arrivi
  # Docker, non è opzionale per host come gli altri stack.
  ansible.builtin.copy:
    src: /opt/docker-compose/hawser/docker-compose.yml
    dest: /opt/hawser/docker-compose.yml
    mode: '0644'

- name: Genera .env con il token per-host recuperato da Infisical (mai scritto nel repo)
  ansible.builtin.copy:
    dest: /opt/hawser/.env
    content: |
      TOKEN={{ hostvars['localhost'].hawser_tokens[inventory_hostname] }}
    mode: '0600'
  no_log: true

- name: Avvia Hawser
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /opt/hawser
  changed_when: true
