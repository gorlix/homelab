# Gestito da Ansible (ruolo omb_vps_host, HOME-61, ADR-012): accesso di
# OpenMausBot al daemon Docker di questa LXC per i desktop dei bot.
# Nome 90-: viene incluso dopo 50-redhat.conf, e "Match all" in fondo chiude
# il blocco, così le righe di sshd_config dopo l'Include restano globali.
Match User omb-docker
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    GSSAPIAuthentication no
    ForceCommand /usr/local/libexec/omb-docker-gate
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    GatewayPorts no
    # Solo forward locali (-L) e solo verso la porta del noVNC dei desktop:
    # l'IP del desktop cambia a ogni ricreazione sul bridge Docker, quindi
    # l'host non si può fissare. Le reti private fuori dall'LXC le chiude
    # comunque il firewall Proxmox (firewall.tf).
    AllowTcpForwarding local
    PermitOpen *:6901
Match all
