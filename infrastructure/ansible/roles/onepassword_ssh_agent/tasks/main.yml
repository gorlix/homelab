---
# Percorso "recovery": run.sh, usato da solo (senza passare da OpenTofu), non ha
# mai avuto la chiave privata dei nodi — quella esiste solo per pochi secondi
# nell'ssh-agent che OpenTofu avvia dentro il proprio local-exec, poi viene
# distrutta (vedi ADR-006). Questo ruolo la recupera invece da 1Password, dove
# onepassword_ssh_keys l'ha già salvata, e la carica nell'ssh-agent già avviato da
# run.sh — così un run standalone (es. per ripushare un docker-compose aggiornato)
# funziona senza dover forzare un tofu apply -replace.

- name: Verifica che onepassword_vault_id sia stato passato
  ansible.builtin.assert:
    that:
      - onepassword_vault_id is defined
      - onepassword_vault_id | length > 0
    fail_msg: >-
      onepassword_vault_id mancante: passalo con -e onepassword_vault_id=<uuid-vault>.

- name: Recupera dal vault la chiave privata SSH di ciascun nodo target
  onepassword.connect.item_info:
    hostname: "{{ lookup('env', 'OP_CONNECT_HOST') | default('http://localhost:8080', true) }}"
    token: "{{ lookup('env', 'OP_CONNECT_TOKEN') }}"
    vault: "{{ onepassword_vault_id }}"
    item: "{{ hostvars[item].op_item_title }}"
    field: private_key
  loop: "{{ groups['docker_nodes'] | default([]) }}"
  register: onepassword_ssh_agent_fetched
  no_log: true
  vars:
    ansible_python_interpreter: "{{ onepassword_python_interpreter }}"

- name: Carica ogni chiave privata recuperata nell'ssh-agent già avviato da run.sh
  ansible.builtin.command:
    cmd: ssh-add -
    stdin: "{{ fetched.field }}"
  loop: "{{ onepassword_ssh_agent_fetched.results }}"
  loop_control:
    loop_var: fetched
    label: "{{ fetched.item }}"
  no_log: true
  changed_when: true

# Con tutte le chiavi nell'agent, ssh le offre una dopo l'altra e sshd chiude
# dopo MaxAuthTries (6): oltre il sesto nodo l'host giusto non arrivava mai
# ("Too many authentication failures", visto il 15/10/2026 su Traefik-110,
# settimo di 7). La pubblica di ogni nodo va in ssh_pubkey_dir, e
# group_vars/docker_nodes.yml fa offrire a ssh solo quella (IdentitiesOnly).
- name: Crea la cartella delle chiavi pubbliche dei nodi (tmpfs)
  ansible.builtin.file:
    path: "{{ ssh_pubkey_dir }}"
    state: directory
    mode: '0700'

- name: Deriva la chiave pubblica di ciascun nodo dalla privata recuperata
  ansible.builtin.command:
    cmd: ssh-keygen -y -f /dev/stdin
    stdin: "{{ fetched.field }}"
  loop: "{{ onepassword_ssh_agent_fetched.results }}"
  loop_control:
    loop_var: fetched
    label: "{{ fetched.item }}"
  register: onepassword_ssh_agent_pubkeys
  no_log: true
  changed_when: false

- name: Scrive la chiave pubblica di ciascun nodo in ssh_pubkey_dir
  ansible.builtin.copy:
    dest: "{{ ssh_pubkey_dir }}/{{ derived.fetched.item }}.pub"
    content: "{{ derived.stdout }}\n"
    mode: '0644'
  loop: "{{ onepassword_ssh_agent_pubkeys.results }}"
  loop_control:
    loop_var: derived
    label: "{{ derived.fetched.item }}"
