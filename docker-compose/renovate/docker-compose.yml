# Renovate self-hosted non ha una modalità daemon nativa: la documentazione
# ufficiale conferma che ogni invocazione scansiona una volta ed esce, va
# ripetuta da uno scheduler esterno (verificato prima di scrivere questo
# file, non assunto). Per restare nello stesso pattern di tutti gli altri
# servizi qui dentro (`docker compose up -d`, nessun cron esterno sull'host)
# l'entrypoint sostituisce l'esecuzione one-shot con un loop minimo: scansiona,
# aspetta RENOVATE_INTERVAL_SECONDS (default 1h), ripete.
services:
  renovate:
    image: renovate/renovate:44.24.1
    container_name: renovate
    restart: unless-stopped
    env_file: .env
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: '["gorlix/homelab"]'
      RENOVATE_ONBOARDING: "false"
      RENOVATE_REQUIRE_CONFIG: optional
      # Fa creare i commit tramite l'API di GitHub invece che con git in locale
      # nel container: GitHub firma/marca automaticamente questi commit come
      # "Verified", senza dover gestire una vera chiave GPG/SSH per il bot.
      # Un limite noto (non nostro, di GitHub): se una PR viene mergiata con
      # strategia "rebase" il commit di merge risultante NON risulta firmato —
      # workaround noto è disabilitare il rebase merge nelle impostazioni del
      # repo, non ancora fatto qui.
      RENOVATE_PLATFORM_COMMIT: enabled
    entrypoint:
      - sh
      - -c
      - "while true; do renovate; sleep ${RENOVATE_INTERVAL_SECONDS:-3600}; done"
