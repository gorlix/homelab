version: "3"

services:
  backend:
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    image: infisical/infisical:v0.162.19
    pull_policy: always
    env_file: .env
    ports:
      - 8090:8080
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  redis:
    image: redis
    container_name: infisical-redis
    env_file: .env
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - ./data/redis:/data

  db:
    container_name: infisical-db
    # Bump automatico a 18-alpine (major) da Renovate fatto girare a mano il
    # 11/08/2026: infisical-db non è mai ripartito ("Error: in 18+, these
    # Docker images are configured to store database data in a format which
    # is compatible with pg_ctlcluster... appears to be PostgreSQL data in
    # /var/lib/postgresql/data" — 14 -> 18 richiede pg_upgrade reale, non basta
    # cambiare il tag immagine). Rollback immediato per ripristinare il
    # servizio; l'upgrade major va fatto deliberatamente con backup e
    # pg_upgrade, non lasciato a un merge automatico di Renovate. Vedi
    # packageRules in renovate.json per il fix strutturale.
    image: postgres:14-alpine
    restart: always
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10

networks:
  infisical:
