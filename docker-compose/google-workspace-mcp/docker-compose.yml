# Server MCP Google Workspace (taylorwilsdon/google_workspace_mcp) per Rakazo:
# un container per servizio Google (Gmail, Calendar, Drive, Tasks), stessa
# immagine e stesso client OAuth, ognuno con hostname e token propri.
#
# Perché un container per servizio e non uno solo con tutto: in Rakazo la posta
# e il calendario li gestiscono bot diversi. Con un server unico il token di
# ogni connessione avrebbe gli scope di tutti i servizi, e il bot del
# calendario potrebbe leggere la posta. Così il token di mcp-calendar ha solo
# gli scope del calendario. In Rakazo: una voce per account e per servizio,
# assegnata solo al bot che ne ha bisogno.
#
# .env non presente qui: GOOGLE_OAUTH_CLIENT_ID e GOOGLE_OAUTH_CLIENT_SECRET
# stanno su Infisical in prod/google-workspace-mcp (ADR-007), il .env lo genera
# Ansible al deploy.
#
# Gira su Docker-100, non su Rakazo-118: qui dentro ci sono i token di tutte
# le caselle, e su Rakazo-118 girano i computer dei bot con docker.sock nel
# supervisor (ADR-013). Esposti da Traefik-110 come mcp-<servizio>.alessandrogorla.it.
#
# Modalità OAuth 2.1, non quella "legacy": nella legacy l'endpoint non chiede
# nessun login e il bot sceglie la casella passando un indirizzo email in ogni
# chiamata, quindi qualunque bot leggerebbe qualunque casella. In OAuth 2.1
# ogni connessione di Rakazo ha il proprio token, legato a un solo account
# Google, e il server sostituisce l'email passata dal bot con quella del token
# (auth/service_decorator.py upstream).

# Configurazione comune ai quattro servizi. Per ognuno cambiano solo hostname,
# permessi, volume e porta.
x-mcp: &mcp
  image: ghcr.io/taylorwilsdon/google_workspace_mcp:2.4.2
  restart: unless-stopped
  env_file:
    - .env

x-mcp-env: &mcp-env
  MCP_ENABLE_OAUTH21: "true"
  # In OAuth 2.1 l'immagine ascolta già su 0.0.0.0, lo scrivo per chiarezza.
  WORKSPACE_MCP_HOST: 0.0.0.0
  # Chiunque su Internet può fare la registrazione dinamica del client:
  # con questa allowlist l'unico redirect accettato è quello di Rakazo,
  # quindi solo Rakazo può completare un login.
  WORKSPACE_MCP_ALLOWED_CLIENT_REDIRECT_URIS: https://rakazo.alessandrogorla.it/mcp/oauth/callback
  # Fa scegliere l'account Google a ogni Connect: senza, Google riusa
  # l'ultimo account del browser e le voci finirebbero sulla stessa casella.
  WORKSPACE_MCP_OAUTH_PROXY_GOOGLE_PROMPT: select_account consent
  # Token Google e stato del proxy OAuth (client registrati, token emessi a
  # Rakazo) nel volume del servizio: senza, a ogni ricreazione del container
  # tutte le connessioni andrebbero rifatte.
  WORKSPACE_MCP_CREDENTIALS_DIR: /app/store_creds/google
  FASTMCP_HOME: /app/store_creds/fastmcp

services:
  gmail:
    <<: *mcp
    environment:
      <<: *mcp-env
      # URL pubblico: lo usano i metadati OAuth e il redirect verso Google
      # (da registrare sul client: <URL>/oauth2callback). Lo stesso nome
      # nell'allowlist degli Host (DNS rebinding).
      WORKSPACE_EXTERNAL_URL: https://mcp-gmail.alessandrogorla.it
      WORKSPACE_MCP_ALLOWED_HOSTS: mcp-gmail.alessandrogorla.it
      # "drafts": legge, etichetta, archivia e scrive bozze, ma i tool di
      # invio non ci sono, quindi un'email con istruzioni nascoste non può far
      # spedire dati fuori. Lo scope di Google per le bozze (gmail.compose)
      # permetterebbe comunque l'invio: il limite è nei tool esposti, non nel
      # token. Contatti in sola lettura per trovare gli indirizzi.
      WORKSPACE_MCP_PERMISSIONS: gmail:drafts contacts:readonly
    volumes:
      # Volumi con nome e non bind mount: Docker li inizializza dalla
      # cartella dell'immagine, già di proprietà dell'utente app (non root).
      - gmail_creds:/app/store_creds
    ports:
      # 3000 linkwarden, 3010 monitoring, 3020 karakeep.
      - 3030:8000

  calendar:
    <<: *mcp
    environment:
      <<: *mcp-env
      WORKSPACE_EXTERNAL_URL: https://mcp-calendar.alessandrogorla.it
      WORKSPACE_MCP_ALLOWED_HOSTS: mcp-calendar.alessandrogorla.it
      WORKSPACE_MCP_PERMISSIONS: calendar:full
    volumes:
      - calendar_creds:/app/store_creds
    ports:
      - 3031:8000

  drive:
    <<: *mcp
    environment:
      <<: *mcp-env
      WORKSPACE_EXTERNAL_URL: https://mcp-drive.alessandrogorla.it
      WORKSPACE_MCP_ALLOWED_HOSTS: mcp-drive.alessandrogorla.it
      # Completo: il bot del Drive carica, sposta e organizza i file (visto
      # nell'uso reale via Composio), in sola lettura non potrebbe. Cambiare
      # livello cambia gli scope: va rifatto il Connect degli account.
      WORKSPACE_MCP_PERMISSIONS: drive:full
    volumes:
      - drive_creds:/app/store_creds
    ports:
      - 3032:8000

  tasks:
    <<: *mcp
    environment:
      <<: *mcp-env
      WORKSPACE_EXTERNAL_URL: https://mcp-tasks.alessandrogorla.it
      WORKSPACE_MCP_ALLOWED_HOSTS: mcp-tasks.alessandrogorla.it
      # "manage": crea, modifica e completa le attività.
      WORKSPACE_MCP_PERMISSIONS: tasks:manage
    volumes:
      - tasks_creds:/app/store_creds
    ports:
      - 3033:8000

volumes:
  gmail_creds:
  calendar_creds:
  drive_creds:
  tasks_creds:
