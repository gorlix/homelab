# .env non presente in questa cartella: NEXTAUTH_SECRET, MEILI_MASTER_KEY e
# (quando presente) OPENAI_API_KEY vivono su Infisical in prod/karakeep (vedi
# ADR-007), il .env viene generato al deploy dal ruolo Ansible
# infisical_secrets + docker_service.
#
# Gira su Docker-100 (192.168.10.100), esposto da Traefik-110 come
# karakeep.alessandrogorla.it (route statica in traefik/dynamic/dynamic.yml).
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      # 3000 sull'host è già di linkwarden, 3010 di monitoring.
      - 3020:3000
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      # URL pubblico, non ${HOST_IP}: serve a NextAuth per i redirect di
      # login/logout, che passano da Cloudflare -> Traefik.
      NEXTAUTH_URL: https://karakeep.alessandrogorla.it
      # Registrazione chiusa di default: servizio esposto su Internet. Per creare
      # il primo account si mette KARAKEEP_DISABLE_SIGNUPS=false in Infisical,
      # ci si registra dalla LAN (http://192.168.10.100:3020) prima di creare
      # l'hostname pubblico, poi si toglie la variabile e si rifà il deploy.
      DISABLE_SIGNUPS: ${KARAKEEP_DISABLE_SIGNUPS:-true}

      # Tagging/riassunti AI via OpenRouter (API compatibile OpenAI, stesso
      # provider già usato da linkwarden). Senza OPENAI_API_KEY in Infisical
      # l'inferenza resta disattivata e il resto funziona normalmente.
      # Haiku 5.5: legge immagini (serve a INFERENCE_IMAGE_MODEL), supporta
      # structured outputs (INFERENCE_OUTPUT_SCHEMA=structured, il default) e
      # costa quanto gemini-2.5-flash-lite (0.10/0.50 $ per Mtok): per tag e
      # riassunti brevi un modello grande non aggiunge nulla.
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      INFERENCE_TEXT_MODEL: anthropic/claude-haiku-5.5
      INFERENCE_IMAGE_MODEL: anthropic/claude-haiku-5.5
      EMBEDDING_TEXT_MODEL: openai/text-embedding-3-small
      INFERENCE_LANG: italian
      INFERENCE_CONTEXT_LENGTH: 4096

      # You almost never want to change the value of the DATA_DIR variable.
      # If you want to mount a custom directory, change the volume mapping above instead.
      DATA_DIR: /data # DON'T CHANGE THIS
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./meili_data:/meili_data

  # Backup notturno di ./data verso /mnt/persistent-backups, bind mount della
  # LXC su una directory di `pve` (backup_host_path in variables.tf, stesso
  # schema di PACA, vedi ADR-010): sopravvive a un destroy+recreate di
  # Docker-100. Database con `.backup` di SQLite (copia coerente anche con
  # Karakeep acceso, un `cp` del file mentre scrive no) verificato con
  # quick_check, più gli assets in tar. meili_data escluso: è un indice
  # ricostruibile dal pannello admin di Karakeep.
  # Restore: fermare web, estrarre l'archivio in ./data, riavviare, reindex.
  backup:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      TZ: ${TZ:-Europe/Rome}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache sqlite tzdata >/dev/null
        # crond non passa l'environment del container ai job: va su file.
        echo "BACKUP_RETENTION_DAYS=$$BACKUP_RETENTION_DAYS" > /etc/backup.env
        cat > /usr/local/bin/run-backup.sh <<'EOS'
        #!/bin/sh
        set -e -o pipefail
        . /etc/backup.env
        ts="$$(date +%Y%m%d-%H%M%S)"
        stage="/tmp/karakeep-$${ts}"
        tmp="/backups/.karakeep-$${ts}.tar.gz.tmp"
        out="/backups/karakeep-$${ts}.tar.gz"
        mkdir -p "$$stage"
        if sqlite3 /data/db.db ".backup '$$stage/db.db'" \
          && sqlite3 /data/queue.db ".backup '$$stage/queue.db'" \
          && [ "$$(sqlite3 "$$stage/db.db" 'PRAGMA quick_check;')" = "ok" ] \
          && cp -a /data/assets "$$stage/assets" \
          && tar -czf "$$tmp" -C "$$stage" .; then
          mv "$$tmp" "$$out"
          echo "Backup written: $$out"
          find /backups -maxdepth 1 -name 'karakeep-*.tar.gz' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
        else
          echo "Backup failed at $${ts}" >&2
          rm -f "$$tmp"
        fi
        rm -rf "$$stage"
        EOS
        chmod +x /usr/local/bin/run-backup.sh
        mkdir -p /var/spool/cron/crontabs
        echo "$$BACKUP_CRON /usr/local/bin/run-backup.sh >>/proc/1/fd/1 2>>/proc/1/fd/2" > /var/spool/cron/crontabs/root
        echo "Karakeep backup service started — schedule: $$BACKUP_CRON $$TZ (retention: $$BACKUP_RETENTION_DAYS days)."
        exec crond -f -d 8
    volumes:
      # rw, non ro: `.backup` deve poter prendere i lock (file -shm della WAL).
      - ./data:/data
      - ${BACKUP_DIR:-/mnt/persistent-backups}:/backups
    depends_on:
      - web
