# .env (TUNNEL_TOKEN per cloudflared, TMA_API_KEY per traefik-manager-agent)
# non presente in questa cartella: migrato su Infisical (vedi ADR-007), generato
# al deploy dal ruolo Ansible infisical_secrets + docker_service.
services:
  traefik:
    image: traefik:v3.7.10
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Fidarsi degli X-Forwarded-* che arrivano da cloudflared (rete traefik_proxy):
      # senza, Traefik li sovrascrive con lo schema del proprio hop (http) e i
      # backend credono di essere serviti in chiaro. Authentik >= 2026.8 genera
      # così URL http:// e il login si rompe per mixed content. Sulla rete ci sono
      # solo cloudflared e traefik; le richieste a 192.168.10.110:80 arrivano dal
      # gateway 172.19.0.1, mentre i client LAN diretti tengono il proprio IP e
      # restano non fidati. Se traefik_proxy venisse ricreata con un'altra subnet,
      # questo valore va aggiornato.
      - --entrypoints.web.forwardedHeaders.trustedIPs=172.19.0.0/16
      # API (senza dashboard) per traefik-manager-agent. api.insecure la serve
      # sull'entrypoint interno "traefik" (:8080), che NON è pubblicato: la
      # raggiungono solo i container su traefik_proxy (cloudflared e l'agent),
      # nessuna route del tunnel punta lì.
      - --api=true
      - --api.insecure=true
      - --api.dashboard=false
      # Access log JSON per la vista log del Traefik Manager (letto dall'agent).
      # Contiene l'IP reale dei client (vedi trustedIPs sopra): resta nel volume
      # traefik_logs, non esce dall'host. Traefik non ruota da solo, ci pensa il
      # servizio accesslog-rotate più sotto.
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.format=json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik_logs:/var/log/traefik
    ports:
      # Pubblicata sull'host invece di usare il nome Docker interno "traefik:80":
      # il connector cloudflared di QUESTO host è l'unico rimasto sul tunnel (il
      # vecchio connector bare-metal su `pve`, causa dell'esposizione del token
      # originale, è stato terminato l'11/08/2026 dopo la rotazione — vedi ADR-006)
      # ma un IP:porta pubblicato resta comunque più robusto di un nome Docker
      # interno se in futuro tornasse a esserci più di un connector attivo.
      - "80:80"
    networks:
      - traefik_proxy

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env
    networks:
      - traefik_proxy
    depends_on:
      - traefik

  # Agent di Traefik Manager (chr0nzz/traefik-manager): permette al Traefik
  # Manager della Region A (traefik.alessandrogorla.it) di vedere router,
  # servizi e salute di questo Traefik. Solo monitoring: dynamic/ è montata
  # :ro perché dynamic.yml è versionato in Git e Ansible lo sovrascrive a ogni
  # deploy — una route creata dalla UI andrebbe persa e uscirebbe dal GitOps.
  # Dalla UI una modifica su questo server fallisce in scrittura, by design.
  # Raggiunto dal TM via tunnel Gorla (tma-gorla.alessandrogorla.it, route in
  # dynamic/dynamic.yml), TLS di Cloudflare: nessuna porta pubblicata. L'unica
  # credenziale è TMA_API_KEY (generata in TM, Settings - Agents), con il rate
  # limit dell'agent come unico freno a tentativi a forza bruta.
  traefik-manager-agent:
    image: ghcr.io/chr0nzz/traefik-manager-agent:1.15.2
    container_name: traefik-manager-agent
    restart: unless-stopped
    environment:
      - TMA_API_KEY=${TMA_API_KEY:?TMA_API_KEY mancante nel .env generato da Infisical}
      - TRAEFIK_API_URL=http://traefik:8080
      - CONFIG_PATH=/app/config
      - ACCESS_LOG_PATH=/logs/access.log
      # Niente PUID/PGID: con un utente non root l'entrypoint esige /app/config
      # scrivibile e si rifiuta di partire con il mount :ro (verificato il
      # 16/10/2026, crash loop). Gira quindi come root nel container, ma :ro
      # blocca la scrittura anche a root e l'agent non ha docker.sock.
    volumes:
      - ./dynamic:/app/config:ro
      - tma_backups:/app/backups
      - traefik_logs:/logs:ro
    networks:
      - traefik_proxy
    depends_on:
      - traefik

  # Rotazione dell'access log: Traefik non la fa e il disco di Traefik-110 sta
  # sul thin pool local-lvm di pve, già vicino al pieno. Ogni ora, sopra i
  # 50 MB, copia il file in access.log.1 (sovrascrivendo la copia precedente) e
  # tronca l'originale: Traefik scrive in append, quindi continua sullo stesso
  # file senza riavvio. Occupazione massima ~100 MB. Le righe scritte tra copia
  # e troncamento si perdono: accettabile per un log di sola consultazione.
  accesslog-rotate:
    image: alpine:3.24
    container_name: traefik-accesslog-rotate
    restart: unless-stopped
    environment:
      MAX_BYTES: 52428800
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/logs/access.log
          if [ -f "$$f" ] && [ "$$(stat -c %s "$$f")" -gt "$$MAX_BYTES" ]; then
            cp "$$f" "$$f.1" && : > "$$f"
            echo "ruotato $$(date -Iseconds)"
          fi
          sleep 3600
        done
    volumes:
      - traefik_logs:/logs
    network_mode: none

volumes:
  tma_backups:
  traefik_logs:

networks:
  traefik_proxy:
    name: traefik_proxy
    external: true
