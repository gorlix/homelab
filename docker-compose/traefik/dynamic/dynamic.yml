http:
  routers:
    infisical:
      rule: "Host(`env.alessandrogorla.it`)"
      entryPoints:
        - web
      service: infisical

    onepassword-connect:
      rule: "Host(`1p.alessandrogorla.it`)"
      entryPoints:
        - web
      service: onepassword-connect

    paca:
      rule: "Host(`paca.alessandrogorla.it`)"
      entryPoints:
        - web
      service: paca

    # minder-server (project_minder, staging) gira sulla LXC dedicata
    # Minder-130 (192.168.10.130) — vedi infrastructure/opentofu/nodes/dell-emc/variables.tf.
    # Backend non ancora up al momento di questa modifica (compose non ancora
    # versionato): la route è pre-cablata, restituirà 502 finché il gateway
    # Caddy dello stack minder-server non è deployato e in ascolto su :80.
    minder-server:
      rule: "Host(`api-minder.alessandrogorla.it`)"
      entryPoints:
        - web
      service: minder-server

    karakeep:
      rule: "Host(`karakeep.alessandrogorla.it`)"
      entryPoints:
        - web
      service: karakeep

    # Niente middleware Authentik forward-auth su questa route: romperebbe
    # pairing, stream SSE, app iOS e webhook. L'autenticazione è il pairing
    # del server stesso (vedi ADR-012).
    openmausbot:
      rule: "Host(`maus.alessandrogorla.it`)"
      entryPoints:
        - web
      service: openmausbot

    authentik:
      rule: "Host(`auth.alessandrogorla.it`)"
      entryPoints:
        - web
      service: authentik

    # Agent del Traefik Manager di casa (vedi docker-compose.yml): il TM lo
    # chiama in HTTPS, il TLS lo termina Cloudflare.
    traefik-manager-agent:
      rule: "Host(`tma-gorla.alessandrogorla.it`)"
      entryPoints:
        - web
      service: traefik-manager-agent

  services:
    # Infisical e 1Password Connect girano su pve-management (192.168.10.200), un
    # host diverso da quello di Traefik (192.168.10.110): niente docker provider/
    # label per loro, Traefik li raggiunge come backend statici via IP interno.
    infisical:
      loadBalancer:
        servers:
          - url: "http://192.168.10.200:8090"

    onepassword-connect:
      loadBalancer:
        servers:
          - url: "http://192.168.10.200:8080"

    # PACA gira sulla LXC dedicata Paca-120 (192.168.10.120), isolata da
    # Docker-100 per il rischio docker.sock di agent-runner — vedi
    # infrastructure/opentofu/nodes/dell-emc/variables.tf. Stesso motivo di backend statico
    # cross-host di Infisical/1Password Connect sopra.
    paca:
      loadBalancer:
        servers:
          - url: "http://192.168.10.120:80"

    minder-server:
      loadBalancer:
        servers:
          - url: "http://192.168.10.130:80"

    # Karakeep gira su Docker-100 (192.168.10.100), host diverso da Traefik-110:
    # backend statico come gli altri. Porta 3020, non 3000 (già di linkwarden).
    karakeep:
      loadBalancer:
        servers:
          - url: "http://192.168.10.100:3020"

    # 8080 è il Caddy sidecar di Maus-117, non il server (8799 resta su
    # loopback). flushInterval -1 per non bufferizzare lo stream SSE della chat.
    openmausbot:
      loadBalancer:
        servers:
          - url: "http://192.168.10.117:8080"
        responseForwarding:
          flushInterval: "-1"

    # Authentik gira sulla LXC 111 (192.168.10.111), host diverso da Traefik-110:
    # backend statico. Porta HTTP 9000: il TLS lo termina Cloudflare, lo schema
    # originale arriva ad Authentik via X-Forwarded-Proto (vedi trustedIPs
    # sull'entrypoint web in docker-compose.yml).
    authentik:
      loadBalancer:
        servers:
          - url: "http://192.168.10.111:9000"

    # Stesso host e stessa rete Docker (traefik_proxy) di Traefik: nome del
    # container invece dell'IP, la porta 8090 non è pubblicata.
    traefik-manager-agent:
      loadBalancer:
        servers:
          - url: "http://traefik-manager-agent:8090"
