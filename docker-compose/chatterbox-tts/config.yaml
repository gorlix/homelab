# Config di Chatterbox-TTS-Server. Valori non elencati: default del server.
# Copiato da Ansible a ogni deploy (cambi fatti dalla Web UI vanno persi).
server:
  host: 0.0.0.0
  port: 8004
model:
  # Turbo è solo inglese: per l'italiano serve il multilingual.
  repo_id: chatterbox-multilingual
tts_engine:
  device: cpu
generation_defaults:
  # Lingua usata da /v1/audio/speech, che non la riceve nella richiesta.
  language: it
audio_output:
  format: wav
