# Server TTS Chatterbox (Resemble AI) con API compatibile OpenAI, come voce
# dei bot di OpenMausBot su Maus-117 (ADR-012). Gira su CPU, su Docker-100
# (192.168.10.100), accanto ai server MCP.
#
# Server: devnen/Chatterbox-TTS-Server, fissato al tag v2.0.0. Non pubblica
# immagini: si builda dal repo (Dockerfile.cpu, torch solo CPU). Il Dockerfile
# installa però chatterbox-v2 da `@master` senza pin: un rebuild può portare
# codice diverso. `pull_policy: build` ricostruisce solo quando cambia il tag
# qui sotto o si lancia `docker compose build`.
#
# Modello: chatterbox-multilingual (500M, 23 lingue, italiano incluso), scelto
# in config.yaml. Turbo (350M, più veloce) è solo inglese. L'endpoint
# /v1/audio/speech ignora il campo "model" della richiesta: contano il modello
# caricato dal server e la lingua di generation_defaults (config.yaml).
#
# Nessuna autenticazione: il server non ne ha. NON va esposto su Internet né
# da Traefik/Cloudflare. Raggiungibile dalla LAN su :3036; Maus-117 lo vede
# grazie a una regola dedicata del suo firewall (firewall.tf).
#
# Nessun segreto: niente .env, niente Infisical. Il modello si scarica da
# Hugging Face (pubblico) al primo avvio nel volume hf_cache (qualche GB) e
# poi resta lì.
services:
  tts:
    build:
      context: https://github.com/devnen/Chatterbox-TTS-Server.git#v2.0.0
      dockerfile: Dockerfile.cpu
    image: chatterbox-tts-local:2.0.0
    pull_policy: build
    restart: unless-stopped
    ports:
      # 3030-3035 sono i server MCP, 3020-3021 Karakeep.
      - 3036:8004
    volumes:
      - ./config.yaml:/app/config.yaml
      # Volumi con nome e non bind mount: all'avvio un volume nuovo copia il
      # contenuto dell'immagine (le 28 voci predefinite), una cartella vuota
      # dell'host lo nasconderebbe (visto al primo deploy: 0 voci).
      - voices:/app/voices
      - reference_audio:/app/reference_audio
      - hf_cache:/app/hf_cache
      - ./sitecustomize.py:/patches/sitecustomize.py:ro
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      PYTHONPATH: /patches
    # Docker-100 ha 4 core e 8 GB condivisi con Karakeep, Linkwarden, Monitoring
    # e i server MCP. Il tetto evita che torch li affami in sintesi.
    cpus: 3
    mem_limit: 5g
    healthcheck:
      # Primo avvio lento (download del modello): start_period largo.
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8004/v1/audio/voices', timeout=5)"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 600s

volumes:
  hf_cache:
  voices:
  reference_audio:
