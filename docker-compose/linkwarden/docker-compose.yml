# .env non presente in questa cartella: i segreti applicativi (POSTGRES_PASSWORD
# ecc) sono migrati su Infisical (vedi ADR-007) e vengono generati al deploy dal
# ruolo Ansible infisical_secrets + docker_service, non versionati qui.
services:
  postgres:
    # Bump automatico a 18-alpine (major, 16->18) da un merge Renovate non
    # ancora dispiegato: lo stesso bump su infisical-db (14->18) ha mandato
    # giù il servizio per davvero l'11/08/2026 (Postgres 18+ richiede
    # pg_upgrade reale, non basta cambiare il tag immagine). Non ancora
    # dispiegato qui — revertito preventivamente prima che succeda la stessa
    # cosa. Vedi packageRules in renovate.json per il fix strutturale.
    image: postgres:16-alpine
    env_file: .env
    restart: always
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  linkwarden:
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      # - NODE_EXTRA_CA_CERTS=/app/certs/ca.pem
    restart: always
    # build: . # uncomment to build from source
    image: ghcr.io/linkwarden/linkwarden:latest # comment to build from source
    ports:
      - 3000:3000
    volumes:
      - ./data:/data/data
    depends_on:
      - postgres
      - meilisearch
    extra_hosts:
      - "auth.alessandrogorla.it:192.168.10.107"
  meilisearch:
    # Salto enorme (v1.12.8 -> v1.53.0, 40+ minor) proposto dallo stesso merge
    # Renovate del bump di postgres qui sopra, che ha già rotto un altro
    # servizio (infisical-db). Nessuna verifica fatta sulla compatibilità del
    # formato indice tra versioni così distanti — revertito per precauzione,
    # non per certezza che romperebbe qualcosa. Va aggiornato deliberatamente,
    # non lasciato passare in un merge automatico.
    image: getmeili/meilisearch:v1.12.8
    restart: always
    env_file:
      - .env
    volumes:
      - ./meili_data:/meili_data
