# .env non presente in questa cartella: i segreti applicativi (POSTGRES_PASSWORD
# ecc) sono migrati su Infisical (vedi ADR-007) e vengono generati al deploy dal
# ruolo Ansible infisical_secrets + docker_service, non versionati qui.
services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    restart: always
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  linkwarden:
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      # - NODE_EXTRA_CA_CERTS=/app/certs/ca.pem
    restart: always
    # build: . # uncomment to build from source
    image: ghcr.io/linkwarden/linkwarden:latest # comment to build from source
    ports:
      - 3000:3000
    volumes:
      - ./data:/data/data
    depends_on:
      - postgres
      - meilisearch
    extra_hosts:
      - "auth.alessandrogorla.it:192.168.10.107"
  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    restart: always
    env_file:
      - .env
    volumes:
      - ./meili_data:/meili_data
