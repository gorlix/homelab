# .env non presente in questa cartella: i segreti applicativi (credenziali admin
# Grafana, token InfluxDB ecc) sono migrati su Infisical (vedi ADR-007) e vengono
# generati al deploy dal ruolo Ansible infisical_secrets + docker_service.
services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3010:3010"
    env_file: .env
    volumes:
      - ./data/grafana:/var/lib/grafana

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file: .env
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
